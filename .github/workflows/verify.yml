name: Verify
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"   # M106: nightly security-scan; the tests job is skipped on this event
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}   # a nightly run and a push to main never cancel each other
  cancel-in-progress: true
jobs:
  tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with: { fetch-depth: 0 }   # test_intent's cap test needs origin/main (t_30645655)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: { python-version: "3.11" }        # the worker image's Python
      - run: pip install ruff==0.17.4  # must equal tests/size_check.py RUFF_VERSION (test_verify_ruff_pin)
      - run: ruff check --select E9,F63,F7,F82 .  # syntax errors and undefined names only, to start
      # scrub.lua's parity test (maintenance/tests/test_scrub.py LuaParity)
      # runs every fixture line through a real Lua interpreter and skips
      # itself when none is on PATH - without this the hand-written Lua
      # patterns are only ever checked against their own header (I3).
      # lua5.4 backs the scrub.lua parity test; that test skips itself when no lua is
      # on PATH, so an apt mirror outage on the runner must not fail the whole job.
      - run: for i in 1 2 3; do sudo apt-get update || true; sudo apt-get install -y lua5.4 && break; echo "apt attempt $i failed, retrying"; sleep 20; done; command -v lua5.4 || echo "::warning::lua5.4 not installed; LuaParity will skip"
        continue-on-error: true
      - run: |
          python3 -m unittest discover maintenance/tests
      - run: python3 -m unittest discover -s capsule/tests -t .   # Capsule harness core
      # test_docker_image below probes capsule-python:local, so build the base and python stacks
      # the way image.yml does (the web stack is optional: its checks skip when it is absent).
      # build-base.sh chains stacks by digest, which needs the containerd image store.
      - name: build the worker image
        run: |
          f=/etc/docker/daemon.json; c=$(sudo cat "$f" 2>/dev/null || true); [ -n "$c" ] || c='{}'
          printf '%s' "$c" | jq '.features["containerd-snapshotter"]=true' | sudo tee "$f" >/dev/null
          sudo systemctl restart docker
          docker info -f '{{ .DriverStatus }}' | grep -q io.containerd
          export CAPSULE_HOME="$RUNNER_TEMP/capsule-home"
          mkdir -p "$CAPSULE_HOME"
          echo 1 > docker/BUILD_MIN_FREE_BYTES   # the throwaway runner has under 40 GB free
          for layer in base python; do docker/build-base.sh "$layer"; done
          git checkout -- docker/BUILD_MIN_FREE_BYTES   # the tests read the real floor
      # Capsule pins DOCKER_CONTEXT to its engine's context (maintenance/docker_engine.py: orbstack
      # by default, a macOS app); on this Linux runner a context of that name points at the
      # runner's own daemon, so docker calls made through Capsule (lookout_ship.psql) resolve.
      - name: docker context for the default engine
        run: docker context create orbstack --docker host=unix:///var/run/docker.sock
      - run: |
          export AGENT_OPS_NO_LAUNCHCTL=1 AGENT_OPS_NO_DOCKER=1 RUN_DOCKER_TESTS=1   # opt-in: the runner has docker
          export CAPSULE_OPS_PY=python3   # no agent venv on the runner; events.py only needs stdlib
          bash tests/test_run_sh.sh
          bash tests/test_cleanup.sh
          bash tests/test_docker_image.sh   # RUN_DOCKER_TESTS=1: builds and probes the worker image
          bash tests/test_migration_pg.sh   # RUN_DOCKER_TESTS=1: real postgres
          bash tests/test_alert_rules_pg.sh   # RUN_DOCKER_TESTS=1: every rules.yaml rawSql against real postgres
          bash tests/test_fluent_bit_scrub.sh   # RUN_DOCKER_TESTS=1: scrub.lua through a real fluent-bit
          bash tests/test_ci_yaml.sh
          bash tests/test_capsule_secret.sh
          bash tests/test_lib_compose.sh
          bash tests/test_capsule_compose_recreate.sh
          bash tests/test_heal.sh
          bash tests/test_no_secret_values.sh
          bash tests/test_report_notices.sh
          bash tests/test_report_power.sh
          bash tests/test_report_budgets.sh
          bash tests/test_report_retrieval.sh
          bash tests/test_report_brief.sh
          bash tests/test_close.sh
          bash tests/test_blocked_tonight.sh
          bash tests/test_remove_card.sh
          bash tests/test_status.sh
          bash tests/test_capsule_park.sh
          bash tests/test_report_coverage.sh
          # test_bootstrap.sh, test_backup.sh, test_restore.sh are macOS-only
          # (bootstrap.sh refuses non-Darwin; backup/restore use `stat -f`) -
          # excluded here, see RUNBOOK.md ## CI.
  public-tree:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest   # O260: Python only; checks the public tree on every push and PR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: { python-version: "3.11" }
      - if: hashFiles('release/private-denylist.txt') == ''   # public repo only: the private repo lints in the tests job
        run: |
          git -c core.quotePath=false ls-files > "$RUNNER_TEMP/allowlist.txt"
          python3 maintenance/public_lint.py --generic-only --allowlist "$RUNNER_TEMP/allowlist.txt"
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with: { fetch-depth: 0 }
      # R11 (D312, D240): the MIT gitleaks CLI, pinned and checksummed, replaces gitleaks-action (custom licence).
      - name: gitleaks
        env:
          GL: "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1"
          GL_TGZ: "gitleaks_8.30.1_linux_x64.tar.gz"
          GL_SHA: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gl.tgz" "$GL/$GL_TGZ"
          echo "$GL_SHA  $RUNNER_TEMP/gl.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --config .gitleaks.toml --redact --exit-code 1   # one config, shared with the nightly secret phase
      # Advisory for the first two weeks (row 129), then blocking on High:
      # drop continue-on-error and add --strict when the first clean fortnight
      # is on the board. capsule-corp is stdlib-only, so this audits the two CI
      # pins and anything a future requirements file adds.
      - run: pip install pip-audit==2.7.3
      - run: pip-audit --progress-spinner=off .
        continue-on-error: true
      # C12 (decision row 140). Advisory checks: the licence allowlist
      # (G1), NOTICE freshness (G5) and the policy-document presence gate
      # (G6, checking the five files under docs/policies/); the SBOM and its
      # vulnerability scan (G3/G4) are the syft-sbom and vulnerabilities steps
      # at the end of the job. Each is continue-on-error until
      # its flag flips - see docs/RUNBOOK.md "Legal limits and money".
      - name: licences
        run: python3 maintenance/notice_gen.py --scan && python3 maintenance/notice_gen.py --check
        continue-on-error: true
      - name: policies
        run: python3 maintenance/policy_check.py
        continue-on-error: true
      # M106 (2026-09-10 correctness-over-green plan): three more scanners, each
      # pinned to its latest stable at build time (2026-10-27). First run is
      # report-only: semgrep and trivy through their own flags (semgrep exits 0
      # on findings unless --error; trivy exit-code '0'), osv-scanner has no
      # such flag so its one step is continue-on-error. Flip each to blocking
      # (--error, exit-code '1', drop continue-on-error) after a clean fortnight.
      - name: semgrep
        run: |
          pip install semgrep==1.182.0
          semgrep scan --metrics=off --config p/owasp-top-ten --config p/python .
      # SEC-10 (M173): report-only. JSON reports -> findings -> the verdict ledger totals
      # (docs/security-verdicts.jsonl). Never fails the job; --strict stays off until the
      # ledger has a clean fortnight.
      - name: security verdicts
        continue-on-error: true
        env:
          GL: "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1"
          GL_TGZ: "gitleaks_8.30.1_linux_x64.tar.gz"
          GL_SHA: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          R="$RUNNER_TEMP"
          { curl -sSfL -o "$R/gl.tgz" "$GL/$GL_TGZ" \
            && echo "$GL_SHA  $R/gl.tgz" | sha256sum -c - \
            && tar -xzf "$R/gl.tgz" -C "$R" gitleaks \
            && "$R/gitleaks" detect --config .gitleaks.toml --redact --exit-code 0 \
                 --report-format json --report-path "$R/gitleaks.json"; } \
            || echo "::warning::gitleaks download, checksum or scan failed"
          semgrep scan --metrics=off --config p/owasp-top-ten --config p/python \
            --json --output "$R/semgrep.json" . || true
          F=""
          for t in gitleaks semgrep; do
            if [ -s "$R/$t.json" ]; then F="$F --$t $R/$t.json"
            else echo "::warning::$t report missing, its findings are left out"; fi
          done
          { python3 -m capsule security findings $F > "$R/findings.json" \
            && python3 -m capsule security check --findings "$R/findings.json"; } || true
      - name: osv-scanner
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan source --recursive . || [ $? -eq 128 ]   # 128 = no package sources (this repo is stdlib-only): clean, not a failure
        continue-on-error: true   # real findings (exit 1) stay advisory
      - name: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          version: v0.76.2  # the action's own default is older (v0.70.0)
          exit-code: '0'
      # M106: Syft SBOM (SPDX JSON), uploaded as a workflow artifact. Advisory
      # only; the action bundles its own pinned Syft release.
      - name: syft-sbom
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          format: spdx-json
          output-file: syft-sbom.spdx.json
          upload-artifact: true
        continue-on-error: true
      # G4: grype scans the SBOM the step above wrote. The runner has no
      # syft/grype/osv-scanner on PATH, so the old sbom.sh wrapper steps here only
      # ever printed skip lines and went green having scanned nothing; this
      # action installs grype itself and errors if the SBOM is missing. Advisory
      # (continue-on-error) until the flip in docs/RUNBOOK.md "SBOM and
      # vulnerability scan"; severity-cutoff matches sbom.sh's --fail-on high.
      - name: vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          sbom: syft-sbom.spdx.json
          severity-cutoff: high
          output-format: table
        continue-on-error: true
  install-smoke:
    # RPUB-2: a stranger's first run on a clean mac. Dry run only: it prints every step and
    # writes nothing, in a throwaway CAPSULE_HOME. Cheap: nothing is installed.
    if: github.event_name != 'schedule'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: { python-version: "3.11" }
      - name: install.sh --dry-run and capsule --help
        run: |
          CAPSULE_HOME="$(mktemp -d)/capsule-home"
          export CAPSULE_HOME
          ./install.sh --dry-run --capsule-home "$CAPSULE_HOME"
          PYTHONPATH="$PWD" python3 -P -m capsule --help
          test ! -e "$CAPSULE_HOME"   # a dry run creates nothing
