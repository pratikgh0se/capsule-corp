# One secret-scanning config, two consumers: the CI security-scan job
# (GITLEAKS_CONFIG) and the nightly secret phase (gitleaks git --config).
# C5 / M106, decision row 129.
title = "capsule-corp"
[extend]
useDefault = true

# Singular [allowlist], not [[allowlists]]: CI runs the gitleaks CLI v8.30.1 (the verify.yml
# download, which replaced the old action pinned at 8.24.3; that one ignored the plural global
# table added in 8.25). The singular form is read by every version (deprecated, still honoured).
[allowlist]
description = "fixture tokens in the suite - deliberately token-shaped, never real"
paths = [
  '''^maintenance/tests/.*''',
  '''^capsule/tests/.*''',
  '''^tests/.*''',
  '''^docs/superpowers/plans/2026-09-08-secrets-cutover\.md$''',
]
