# docker/IMAGES.lock: one `<ref>@sha256:<digest>` row per image layer (spec "Worker images",
# section 1). Every edge between layers is a digest, never a tag. Rows are written by
# docker/build-base.sh (base) and, in later slices, the builder loop (stacks, projects);
# do not hand-edit a digest. This file is the maintainer's record: the runner reads
# `$CAPSULE_HOME/images.lock` (capsule/runners/docker.py runs its capsule-python row when the
# board has no project row; the old IMAGES_LOCK env opt-in is ignored). With no usable row
# there is no worker image and the start refuses; OPS_WORKER_IMAGE beats every row.
# docker/build-base.sh and tests/test_docker_base_image.sh still honour IMAGES_LOCK as a
# host-only write target.
# The web row is a superset of the python row's tooling (same pins, perl, ui_guard; a test keeps them equal).
