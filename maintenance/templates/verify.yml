name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }        # the worker image's Python
      - run: pip install ruff==0.6.9
      - run: ruff check --select E9,F63,F7,F82 .  # syntax errors and undefined names only, to start
      # unittest discover would recurse into tests/ui (it has __init__.py) and
      # fail importing Playwright there; tests/ui runs in qa's container, not
      # here - so collect only the top-level test_*.py files, non-recursively.
      - run: |
          python3 - <<'PY'
          import pathlib, sys, unittest
          names = sorted(p.stem for p in pathlib.Path("tests").glob("test_*.py"))
          loader = unittest.TestLoader()
          suite = unittest.TestSuite(loader.loadTestsFromName(f"tests.{n}") for n in names)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # The MIT gitleaks CLI, pinned and checksummed (same as capsule-corp's own verify.yml).
      - name: gitleaks
        env:
          GL: "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1"
          GL_TGZ: "gitleaks_8.30.1_linux_x64.tar.gz"
          GL_SHA: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gl.tgz" "$GL/$GL_TGZ"
          echo "$GL_SHA  $RUNNER_TEMP/gl.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --redact --exit-code 1
