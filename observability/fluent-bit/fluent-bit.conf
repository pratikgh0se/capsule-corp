[SERVICE]
    Flush        5
    Log_Level    warn
    Parsers_File parsers.conf

[INPUT]
    Name             tail
    Path             /vault-logs/*.log
    Tag              vault.*
    Path_Key         path
    Refresh_Interval 10
    Skip_Long_Lines  On
    Mem_Buf_Limit    8MB
    DB               /fluent-bit/state/vault.db

[INPUT]
    Name             tail
    Path             /capsule/boards/*/spool/*/worker.log
    Tag              capsule.worker.*
    Path_Key         path
    Refresh_Interval 10
    Skip_Long_Lines  On
    Mem_Buf_Limit    8MB
    DB               /fluent-bit/state/capsule-worker.db

[INPUT]
    Name             tail
    Path             /capsule/logs/tick*.log
    Tag              capsule.tick
    Path_Key         path
    Refresh_Interval 10
    Skip_Long_Lines  On
    Mem_Buf_Limit    8MB
    DB               /fluent-bit/state/capsule-tick.db

[INPUT]
    Name             tail
    Path             /capsule/boards/*/outbox.log
    Tag              capsule.outbox
    Path_Key         path
    Refresh_Interval 10
    Skip_Long_Lines  On
    Mem_Buf_Limit    8MB
    DB               /fluent-bit/state/capsule-outbox.db

[FILTER]
    Name    lua
    Match   *
    script  labels.lua
    call    add_labels

[FILTER]
    Name    lua
    Match   *
    script  scrub.lua
    call    scrub_log

[OUTPUT]
    Name        loki
    Match       *
    Host        loki
    Port        3100
    Labels      job=$job, board=$board, task_id=$task_id, profile=$profile, vault_job=$vault_job, run_id=$run_id
    Line_Format key_value
    Auto_Kubernetes_Labels Off
