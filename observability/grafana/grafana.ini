[server]
http_addr = 0.0.0.0
http_port = 3000
domain = cc.grafana.localhost
root_url = http://cc.grafana.localhost/
[security]
allow_embedding = true
admin_user = admin
# W333: no login to look at dashboards. Anonymous is Viewer, never Admin: a bridge-network
# container can reach this port through host.docker.internal (docs/EGRESS.md). Edits go
# through the admin login. viewers_can_edit stays off (default). admin_user stays for API use.
[auth.anonymous]
enabled = true
org_role = Viewer
[users]
allow_sign_up = false
[plugins]
allow_loading_unsigned_plugins =
[analytics]
reporting_enabled = false
check_for_updates = false
# W346: Factory Overview (uid lookout-home) is the home page for everyone, anonymous included.
[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/lookout/home.json
