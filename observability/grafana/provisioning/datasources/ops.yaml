apiVersion: 1
datasources:
  - name: ops
    type: postgres
    uid: ops-pg
    url: postgres:5432
    user: ops
    secureJsonData:
      password: ${OPS_PG_PASSWORD}
    jsonData:
      database: ops
      sslmode: disable
      postgresVersion: 1600
    isDefault: true
  - name: loki
    type: loki
    uid: ops-loki
    url: http://loki:3100
