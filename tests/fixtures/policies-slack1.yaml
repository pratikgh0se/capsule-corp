apiVersion: 1
policies:
  - orgId: 1
    receiver: capsule-slack-alerts
    group_by: [alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
    routes:
      - receiver: capsule-slack-alerts
        object_matchers:
          - ["severity", "=", "page"]
      - receiver: capsule-slack-activity
        object_matchers:
          - ["severity", "=", "notice"]
